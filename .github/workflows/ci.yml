name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Validate schemas
        run: |
          python scripts/validate_schema.py schemas/standard_dv_mapping.yaml
          python scripts/validate_schema.py schemas/standard_sensor_mapping.yaml
          python scripts/validate_schema.py schemas/standard_detection_mapping.yaml
          python scripts/validate_schema.py schemas/standard_metadata_mapping.yaml

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
