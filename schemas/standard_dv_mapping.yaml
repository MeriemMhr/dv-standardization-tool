  # ================================================================
  #  COGNITIVE LOAD — sART (Situation Awareness Rating Technique)
  # ================================================================
  - id: sart_total
    label: "sART Total Score"
    cluster: cognitive_load
    measurement:
      category: Continuous
      primary_unit: "composite"
      scale_type: ordinal
      direction: higher_is_better
    aliases: [SART_total, sart_score, SART, situational_awareness_rating]
    instruments: ["SART"]
    notes: "Total = Understanding − (Demand − Supply). Range depends on subscale computation."

  - id: sart_understanding
    label: "sART Understanding Subscale"
    cluster: cognitive_load
    measurement:
      category: Continuous
      primary_unit: "21-point (0–20)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [0, 20]
    aliases: [sart_understanding_rating, sart_u, SART_Understanding, SARTUnderstanding]
    instruments: ["SART"]
    notes: >
      Understanding subscale of the Situation Awareness Rating Technique
      (SART; Taylor 1990). Scored 0–20. Distinct from eHMI comprehension
      items — do not pool with understanding_rating.

  - id: sart_demand
    label: "sART Demand Subscale"
    cluster: cognitive_load
    measurement:
      category: Continuous
      primary_unit: "21-point (0–20)"
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases: [sart_d, SART_Demand, SARTDemand, sart_demand_rating]
    instruments: ["SART"]

  - id: sart_supply
    label: "sART Supply Subscale"
    cluster: cognitive_load
    measurement:
      category: Continuous
      primary_unit: "21-point (0–20)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [0, 20]
    aliases: [sart_s, SART_Supply, SARTSupply, sart_supply_rating]
    instruments: ["SART"]

  - id: situational_awareness
    label: "Situational Awareness (generic)"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: score
      allowed_units: [score, Likert, percentage]
      scale_type: ordinal
      direction: higher_is_better
    aliases:
      - sa
      - SA_score
      - sagat_score
    instruments:
      - "SAGAT"
      - "SPAM"
    units: ["score", "%"]

  # ================================================================
  #  SAFETY & TRUST
  # ================================================================
  - id: perceived_safety
    label: "Perceived Safety"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "7-point (-3–3)"
      allowed_units: [Likert, score]
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [-3, 3]
    aliases: [PerceivedSafety, PS, perceived_safety_score, safety_rating]
    notes: "Bipolar 7-point scale (−3 to +3) as used in eHMI studies."

  - id: perceived_risk
    label: "Perceived Risk"
    cluster: safety_trust
    measurement:
      category: Continuous
      primary_unit: "VAS (1–100)"
      allowed_units: [VAS, score]
      scale_type: ratio
      direction: lower_is_better
      canonical_range: [1, 100]
    aliases: [perceivedRisk, perceived_risk_rating, risk_rating, ArduinoData1_osf_cwd6h]
    instruments: []
    units: ["VAS (1–100)"]
    notes: "Visual Analogue Scale for perceived risk. In osf_cwd6h, ArduinoData1 encodes this measure."

  # ---- Trust: generic single-item ----
  - id: trust_rating
    label: "Trust in Automation / eHMI"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      allowed_units: [Likert, score]
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [Trust, trust_score, trust_in_automation]
    notes: "Generic single-item trust. For multi-item scales, use TiA or Jian subscales."

  # ---- Trust: Körber Trust-in-Automation (TiA) subscales ----
  - id: tia_reliability_competence
    label: "TiA — Reliability/Competence"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [TiA_RC, tia_rc, reliability_competence, TiA1, trust_reliability]
    instruments: ["Körber TiA"]

  - id: tia_understanding_predictability
    label: "TiA — Understanding/Predictability"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [TiA_UP, tia_up, understanding_predictability, TiA2, trust_predictability]
    instruments: ["Körber TiA"]

  - id: tia_familiarity
    label: "TiA — Familiarity"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [TiA_F, tia_fam, trust_familiarity, TiA3]
    instruments: ["Körber TiA"]

  - id: tia_intention_of_developers
    label: "TiA — Intention of Developers"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [TiA_ID, tia_id, intention_developers, TiA4, trust_developers]
    instruments: ["Körber TiA"]

  - id: tia_propensity_to_trust
    label: "TiA — Propensity to Trust"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [TiA_PT, tia_pt, propensity_trust, TiA5, trust_propensity]
    instruments: ["Körber TiA"]

  - id: tia_trust_in_automation
    label: "TiA — Trust in Automation"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [TiA_TiA, tia_tia, TiA6, trust_automation_scale]
    instruments: ["Körber TiA"]
    notes: "Overall TiA subscale. Not to be confused with the single-item trust_rating."

  # ---- Trust: Jian et al. (2000) ----
  - id: jian_trust
    label: "Jian Trust Scale"
    cluster: safety_trust
    measurement:
      category: Likert
      primary_unit: "7-point (1–7)"
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 7]
    aliases: [jian_trust_score, jian_scale, trust_jian, checklist_trust]
    instruments: ["Jian et al. Trust Scale"]
    notes: "12-item trust/distrust checklist (Jian, Bisantz & Drury 2000). Mean of trust items on 1–7."

  # ---- Understanding (eHMI-specific) ----
  - id: understanding_rating
    label: "Understanding / Comprehension (eHMI)"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "5-point (1–5)"
      allowed_units: [Likert, score]
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 5]
    aliases: [Understanding]
    notes: "eHMI signal comprehension item. Do NOT use for sART Understanding subscale — see sart_understanding."

  # ================================================================
