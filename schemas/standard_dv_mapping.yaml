version: "3.0"
updated: "2026-04-10"

# all `cluster` values must match an ID in thematic_clusters.yaml

# canonical_range: [min, max] — the authoritative numerical range for this DV.
# Read by multi_study_analysis.py for z-score normalization. Omit for unbounded DVs.

dvs:

  # ================================================================
  #  PERFORMANCE
  # ================================================================
  - id: task_completion_time
    label: "Task Completion Time"
    cluster: performance
    measurement:
      category: Time
      primary_unit: seconds
      allowed_units: [s, ms, min]
      scale_type: ratio
      direction: lower_is_better
    aliases:
      - time_spent
      - completion_duration
      - task_time
      - duration
      - time_on_task
      - response_time
      - reaction_time
      - rt
      - task_duration
    instruments: []
    units: ["s", "ms"]
    notes: "Lower-is-better; report central tendency + dispersion."

  - id: task_success
    label: "Task Success Rate"
    cluster: performance
    measurement:
      category: Binary
      primary_unit: proportion
      allowed_units: [proportion, percentage, binary]
      scale_type: ratio
      direction: higher_is_better
      canonical_range: [0, 1]
    aliases:
      - success_rate
      - completion_rate
      - task_success_ratio
      - accuracy
      - correct_rate
    instruments: []
    units: ["%", "proportion"]
    notes: "Define success criteria clearly."

  - id: error_rate
    label: "Error Rate"
    cluster: performance
    measurement:
      category: Accuracy
      primary_unit: percentage
      allowed_units: [percentage, proportion, count, rate]
      scale_type: ratio
      direction: lower_is_better
      canonical_range: [0, 100]
    aliases:
      - mistake_ratio
      - failure_rate
      - error_percentage
      - error_count
      - errors
    instruments: []
    units: ["%", "count", "errors/task"]
    notes: "Distinguish slips vs mistakes if available."

  - id: efficiency
    label: "Efficiency"
    cluster: performance
    measurement:
      category: Proportion
      primary_unit: ratio
      allowed_units: [ratio, rate, percentage]
      scale_type: ratio
      direction: higher_is_better
    aliases:
      - throughput
      - keystrokes_per_task
      - steps_per_task
      - task_efficiency
    instruments: []
    units: ["tasks/min", "actions/task"]
    notes: "Report how computed (e.g., tasks/min; actions/task)."

  # ================================================================
  #  BEHAVIORAL / INTERACTION
  # ================================================================
  - id: click_through_rate
    label: "Click-Through Rate"
    cluster: behavioral_interaction
    measurement:
      category: Proportion
      primary_unit: percentage
      allowed_units: [percentage, proportion, ratio]
      scale_type: ratio
      direction: neutral
      canonical_range: [0, 100]
    aliases:
      - ctr
      - click_ratio
      - clicks_per_view
    instruments: []
    units: ["%", "ratio"]

  - id: interaction_events
    label: "Interaction Events"
    cluster: behavioral_interaction
    measurement:
      category: Count
      primary_unit: integer
      allowed_units: [count, frequency, events_per_min]
      scale_type: ratio
      direction: neutral
    aliases:
      - clicks
      - taps
      - keystrokes
      - interactions
      - touch_count
    instruments: []
    units: ["count", "events/min"]

  - id: retention_time
    label: "Retention / Dwell Time"
    cluster: behavioral_interaction
    measurement:
      category: Time
      primary_unit: seconds
      allowed_units: [s, ms, min]
      scale_type: ratio
      direction: higher_is_better
    aliases:
      - dwell_time
      - session_duration
      - time_on_page
    instruments: []
    units: ["s", "min"]

  # ================================================================
  #  COGNITIVE LOAD — NASA-TLX
  # ================================================================
  - id: TLX_SCORE
    label: "NASA-TLX Composite Score"
    cluster: cognitive_load
    measurement:
      category: Score
      primary_unit: "weighted composite"
      allowed_units: ["weighted composite", "unweighted composite"]
      scale_type: ratio
      direction: lower_is_better
      canonical_range: [0, 100]
    aliases:
      - tlxScore
      - TLXScore
      - tlx_score
      - NASA_TLX_SCORE
      - nasa_tlx_score
      - nasa_tlx_total
      - TLX_total
      - raw_tlx
      - rtlx
    instruments:
      - "NASA-TLX"
    units: ["weighted composite", "unweighted composite"]
    notes: "Derived summary score. Lower is better; report central tendency + dispersion."

  - id: mental_demand
    label: "Mental Demand"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "21-point (0-20)"
      allowed_units: ["21-point", "Likert", "VAS"]
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases:
      - cognitive_load
      - mental_load
      - workload_rating
      - tlx_mental_demand
      - nasa_tlx_mental
      - NASA-TLX1
      - TLX1
      - tlx1
      - NASA_TLX1
      - nasa_tlx1
      - MentalLoad
      - ML
    instruments:
      - "NASA-TLX (Global or Subscales)"
      - "Paas Scale"
      - "RSME"
    units: ["Likert", "VAS"]

  - id: physical_demand
    label: "Physical Demand"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "21-point (0–20)"
      allowed_units: ["21-point", "Likert", "VAS"]
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases:
      - TLX2
      - tlx2
      - NASA_TLX2
      - nasa_tlx2
      - physical_demand
      - tlx_physical
    instruments:
      - "NASA-TLX"
    units: ["Likert", "VAS"]

  - id: temporal_demand
    label: "Temporal Demand"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "21-point (0–20)"
      allowed_units: ["21-point", "Likert", "VAS"]
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases:
      - TLX3
      - tlx3
      - NASA_TLX3
      - nasa_tlx3
      - temporal_demand
      - tlx_temporal
    instruments:
      - "NASA-TLX"
    units: ["Likert", "VAS"]

  - id: performance
    label: "Performance (TLX)"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "21-point (0–20)"
      allowed_units: ["21-point", "Likert", "VAS"]
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases:
      - TLX4
      - tlx4
      - NASA_TLX4
      - nasa_tlx4
      - performance
      - tlx_performance
    instruments:
      - "NASA-TLX"
    units: ["Likert", "VAS"]
    notes: "Note: scale direction is inverted for this subscale in raw NASA-TLX scoring."

  - id: effort
    label: "Effort"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "21-point (0–20)"
      allowed_units: ["21-point", "Likert", "VAS"]
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases:
      - TLX5
      - tlx5
      - NASA_TLX5
      - nasa_tlx5
      - effort
      - tlx_effort
    instruments:
      - "NASA-TLX"
    units: ["Likert", "VAS"]

  - id: frustration
    label: "Frustration"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "21-point (0–20)"
      allowed_units: ["21-point", "Likert", "VAS"]
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 20]
    aliases:
      - TLX6
      - tlx6
      - NASA_TLX6
      - nasa_tlx6
      - frustration
      - tlx_frustration
    instruments:
      - "NASA-TLX"
    units: ["Likert", "VAS"]

  # ================================================================
  #  COGNITIVE LOAD — DALI (Driving Activity Load Index)
  # ================================================================
  - id: dali_total
    label: "DALI Total Score"
    cluster: cognitive_load
    measurement:
      category: Score
      primary_unit: "6-point (0–5)"
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 5]
    aliases:
      - DALI_score
      - dali_score
      - driving_activity_load
      - DALI
    instruments:
      - "DALI"
    notes: "Driving Activity Load Index (Pauzié 2008). Mean of 6 subscales, each 0–5."

  - id: dali_effort_of_attention
    label: "DALI — Effort of Attention"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "6-point (0–5)"
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 5]
    aliases: [DALI_attention, dali_attention, effort_of_attention]
    instruments: ["DALI"]

  - id: dali_visual_demand
    label: "DALI — Visual Demand"
    cluster: cognitive_load
    measurement:
      category: Likert
      primary_unit: "6-point (0–5)"
      scale_type: ordinal
      direction: lower_is_better
      canonical_range: [0, 5]
    aliases: [DALI_visual, dali_visual, visual_demand]
    instruments: ["DALI"]

  - id: dali_auditory_demand
