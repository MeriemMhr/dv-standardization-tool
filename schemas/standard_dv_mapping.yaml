  - id: user_satisfaction
    label: "User Satisfaction"
    cluster: ux_satisfaction
    measurement:
      category: Likert
      primary_unit: "7-point"
      allowed_units: ["5-point", "7-point", "Likert"]
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [1, 7]
    aliases:
      - satisfaction_score
      - satisfaction_rating
      - user_feedback
      - perceived_quality
      - CSAT
    instruments:
      - "UEQ"
      - "UMUX / UMUX-Lite"
      - "CSAT"
      - "NPS"
    units: ["UEQ scale", "Likert", "NPS"]

  - id: usability
    label: "Usability (SUS Total)"
    cluster: ux_satisfaction
    measurement:
      category: Score
      primary_unit: "SUS (0–100)"
      allowed_units: ["100-point", "Likert"]
      scale_type: ordinal
      direction: higher_is_better
      canonical_range: [0, 100]
    aliases:
      - sus_score
      - system_usability_scale
      - SUSScore
      - susScore
      - SYSTEM_USABILITY_SCORE
      - system_usability_score
      - SUS_total
    instruments:
      - "SUS"
    units: ["SUS (0–100)"]

  - id: SUS1
    label: "SUS Item 1"
    cluster: ux_satisfaction
    measurement:
      category: Likert
      primary_unit: "5-point"
